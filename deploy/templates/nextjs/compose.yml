services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE:-app:local}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # env_file: .env.production  # gitignore secrets
    restart: unless-stopped
